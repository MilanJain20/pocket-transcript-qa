[project]
name = "pocket-transcript-qa"
version = "0.1.0"
description = "Offline-first evaluation harness for voice transcripts, summaries, and speaker labels."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Milan Jain" }]
keywords = ["evaluation", "transcripts", "summaries", "asr", "langgraph"]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "langgraph>=0.2.60",
  "mcp>=1.2",
  "pydantic>=2.7",
  "typer>=0.12",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]
local-nli = ["sentence-transformers>=3.0"]

[project.scripts]
pocket-qa = "pocket_qa.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pocket_qa = ["web/index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
